---
- name: Install and configure Nginx on Ubuntu
  hosts: all
  become: true
  vars:
    nginx_config_file: "/etc/nginx/sites-available/custom_site"
    nginx_config_symlink: "/etc/nginx/sites-enabled/custom_site"
    nginx_root: "/var/www/custom_site"
    server_name: "example.com"
  tasks:
    # Update apt cache
    - name: Update apt cache
      apt:
        update_cache: yes

    # Install Nginx
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    # Create a root directory for the website
    - name: Create Nginx root directory
      file:
        path: "{{ nginx_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    # Create a simple HTML file for testing
    - name: Create index.html in root directory
      copy:
        dest: "{{ nginx_root }}/index.html"
        content: |
          <html>
          <head>
              <title>Welcome to Nginx</title>
          </head>
          <body>
              <h1>Welcome to {{ server_name }}</h1>
          </body>
          </html>

    # Configure Nginx
    - name: Create Nginx config file
      copy:
        dest: "{{ nginx_config_file }}"
        content: |
          server {
              listen 80;
              server_name {{ server_name }};
              
              root {{ nginx_root }};
              index index.html;

              location / {
                  try_files $uri $uri/ =404;
              }
          }

    # Enable the Nginx site
    - name: Enable Nginx site
      file:
        src: "{{ nginx_config_file }}"
        dest: "{{ nginx_config_symlink }}"
        state: link

    # Remove default configuration if exists
    - name: Remove default Nginx configuration
      file:
        path: "/etc/nginx/sites-enabled/default"
        state: absent

    # Test Nginx configuration
    - name: Test Nginx configuration
      command: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: "'successful' not in nginx_test.stdout"

    # Reload Nginx
    - name: Reload Nginx
      service:
        name: nginx
        state: restarted
        enabled: yes
